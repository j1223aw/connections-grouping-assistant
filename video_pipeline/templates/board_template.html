<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    width: 1080px;
    height: 1920px;
    background-color: #FAF8F5; /* Warm Alabaster Paper */
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 120px 48px;
    color: #1A1A1A;
    overflow: hidden;
  }

  /* Header Branding */
  .header-card {
    background: #FFFFFF;
    border: 3px solid #1A1A1A;
    border-radius: 24px;
    box-shadow: 0 8px 0 #1A1A1A;
    padding: 36px 48px;
    width: 100%;
    text-align: center;
  }
  .brand-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    letter-spacing: 0.12em;
    color: #6B7280;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .headline {
    font-family: 'Fraunces', serif;
    font-size: 58px;
    font-weight: 900;
    line-height: 1.15;
    color: #1A1A1A;
  }

  /* 4x4 Grid Container */
  .grid-container {
    background: #FFFFFF;
    border: 4px solid #1A1A1A;
    border-radius: 28px;
    box-shadow: 0 12px 0 #1A1A1A;
    padding: 36px;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-gap: 20px;
  }

  /* Tactile Puzzle Tiles */
  .tile {
    height: 180px;
    background: #EFECE6; /* Soft Stone */
    border: 3px solid #1A1A1A;
    border-radius: 18px;
    box-shadow: 0 6px 0 #1A1A1A;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 8px 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
  }

  /* Dynamic Font Scaling Classes */
  .tile.len-short { font-size: 24px; letter-spacing: 0.03em; }
  .tile.len-med   { font-size: 20px; letter-spacing: 0.02em; }
  .tile.len-long  { font-size: 16px; letter-spacing: 0.01em; }
  .tile.len-xlong { font-size: 14px; letter-spacing: 0.005em; }
  .tile.len-xxlong{ font-size: 12.5px; letter-spacing: 0em; }

  /* Active Decoy Highlight */
  .tile.highlighted {
    background: #FFD200;
    transform: translateY(2px);
    box-shadow: 0 4px 0 #1A1A1A;
  }

  /* 4 Authentic NYT Cognitive Tiers */
  .tile.solved-yellow { background: #F9DF6D; color: #1A1A1A; }
  .tile.solved-green  { background: #A0C35A; color: #1A1A1A; }
  .tile.solved-blue   { background: #B0C4EF; color: #1A1A1A; }

  /* Purple Shimmer Keyframe & Glowing Tile */
  @keyframes purpleGlow {
    0% { border-color: #6B21A8; box-shadow: 0 6px 0 #4C1D95, 0 0 16px rgba(186, 129, 197, 0.4); }
    50% { border-color: #E9D5FF; box-shadow: 0 6px 0 #6B21A8, 0 0 28px rgba(186, 129, 197, 0.85); }
    100% { border-color: #6B21A8; box-shadow: 0 6px 0 #4C1D95, 0 0 16px rgba(186, 129, 197, 0.4); }
  }

  .tile.solved-purple {
    background: #BA81C5;
    color: #FFFFFF;
    border: 4px solid #6B21A8;
    box-shadow: 0 6px 0 #4C1D95;
    animation: purpleGlow 2s infinite ease-in-out;
  }

  /* Tier Status Banner */
  .badge-container {
    height: 110px;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
  }
  .badge {
    padding: 18px 40px;
    border-radius: 999px;
    border: 3px solid #1A1A1A;
    box-shadow: 0 6px 0 #1A1A1A;
    font-family: 'JetBrains Mono', monospace;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .badge.yellow { background: #F9DF6D; color: #1A1A1A; }
  .badge.green  { background: #A0C35A; color: #1A1A1A; }
  .badge.blue   { background: #B0C4EF; color: #1A1A1A; }
  .badge.purple { 
    background: #BA81C5; 
    color: #FFFFFF; 
    border: 4px solid #6B21A8; 
    animation: purpleGlow 2s infinite ease-in-out; 
  }

  /* Footer CTA Box */
  .footer-card {
    background: #FFFFFF;
    border: 3px solid #1A1A1A;
    border-radius: 24px;
    box-shadow: 0 8px 0 #1A1A1A;
    padding: 30px 44px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer-text {
    font-size: 30px;
    font-weight: 700;
    color: #4B5563;
  }
  .footer-url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 34px;
    font-weight: 900;
    color: #1A1A1A;
    background: #F9DF6D;
    padding: 10px 24px;
    border: 2px solid #1A1A1A;
    border-radius: 12px;
    box-shadow: 0 4px 0 #1A1A1A;
  }
</style>
</head>
<body>

  <div class="header-card">
    <div class="brand-badge">NYT CONNECTIONS GROUPING ASSISTANT</div>
    <div class="headline">{{HOOK}}</div>
  </div>

  <div class="badge-container">
    {{BADGE_HTML}}
  </div>

  <div class="grid-container">
    {{GRID_ITEMS}}
  </div>

  <div class="footer-card">
    <div class="footer-text">Test boards without spoilers:</div>
    <div class="footer-url">connectionsassistant.com</div>
  </div>

</body>
</html>

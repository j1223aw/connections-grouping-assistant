<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    width: 1080px;
    height: 1920px;
    background-color: #FAF8F5; /* Warm Alabaster Paper */
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 100px 48px;
    color: #1A1A1A;
    overflow: hidden;
  }

  /* Header Branding */
  .header-card {
    background: #FFFFFF;
    border: 3px solid #1A1A1A;
    border-radius: 24px;
    box-shadow: 0 8px 0 #1A1A1A;
    padding: 32px 40px;
    width: 100%;
    text-align: center;
  }
  .brand-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    letter-spacing: 0.12em;
    color: #6B7280;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 800;
  }
  .headline {
    font-family: 'Fraunces', serif;
    font-size: 52px;
    font-weight: 900;
    line-height: 1.15;
    color: #1A1A1A;
  }

  /* Step Indicator Banner */
  .badge-container {
    height: 90px;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
  }
  .badge {
    padding: 14px 36px;
    border-radius: 999px;
    border: 3px solid #1A1A1A;
    box-shadow: 0 6px 0 #1A1A1A;
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .badge.yellow { background: #F9DF6D; color: #1A1A1A; }
  .badge.green  { background: #A0C35A; color: #1A1A1A; }
  .badge.blue   { background: #B0C4EF; color: #1A1A1A; }
  .badge.purple { 
    background: #BA81C5; 
    color: #FFFFFF; 
    border: 4px solid #6B21A8; 
    box-shadow: 0 6px 0 #4C1D95;
  }
  .badge.complete {
    background: #10B981;
    color: #FFFFFF;
    border: 3px solid #065F46;
  }

  /* Main Solution Board Container */
  .board-stage {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: stretch;
  }

  /* Solved Banners Stack */
  .banners-stack {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
  }

  .solved-banner {
    border: 3px solid #1A1A1A;
    border-radius: 20px;
    box-shadow: 0 6px 0 #1A1A1A;
    padding: 18px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
  }
  .solved-banner.yellow { background: #F9DF6D; color: #1A1A1A; }
  .solved-banner.green  { background: #A0C35A; color: #1A1A1A; }
  .solved-banner.blue   { background: #B0C4EF; color: #1A1A1A; }
  .solved-banner.purple { 
    background: #BA81C5; 
    color: #FFFFFF; 
    border: 4px solid #6B21A8;
    box-shadow: 0 6px 0 #4C1D95;
  }

  .banner-category {
    font-family: 'Fraunces', serif;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .banner-words {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .banner-words.len-long { font-size: 15.5px; }
  .banner-words.len-xlong { font-size: 13.5px; }

  /* Remaining Unsolved Tiles Grid (4 cols) */
  .tiles-grid {
    background: #FFFFFF;
    border: 4px solid #1A1A1A;
    border-radius: 26px;
    box-shadow: 0 10px 0 #1A1A1A;
    padding: 24px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-gap: 16px;
    width: 100%;
  }

  /* Tactile Tiles */
  .tile {
    height: 160px;
    background: #EFECE6; /* Soft Stone */
    border: 3px solid #1A1A1A;
    border-radius: 18px;
    box-shadow: 0 5px 0 #1A1A1A;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 8px 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
    transition: all 0.2s ease;
  }

  /* Single-line text scaling classes */
  .tile.len-short { font-size: 23px; }
  .tile.len-med   { font-size: 19px; }
  .tile.len-long  { font-size: 15px; }
  .tile.len-xlong { font-size: 13.5px; }
  .tile.len-xxlong{ font-size: 12px; }

  /* Highlight states */
  .tile.highlight-yellow {
    background: #FDE047;
    border-color: #1A1A1A;
    transform: translateY(2px);
    box-shadow: 0 3px 0 #1A1A1A;
  }
  .tile.highlight-green {
    background: #86EFAC;
    border-color: #1A1A1A;
    transform: translateY(2px);
    box-shadow: 0 3px 0 #1A1A1A;
  }
  .tile.highlight-blue {
    background: #93C5FD;
    border-color: #1A1A1A;
    transform: translateY(2px);
    box-shadow: 0 3px 0 #1A1A1A;
  }
  .tile.highlight-purple {
    background: #D8B4FE;
    border-color: #1A1A1A;
    transform: translateY(2px);
    box-shadow: 0 3px 0 #1A1A1A;
  }

  /* Footer CTA Card */
  .footer-card {
    background: #FFFFFF;
    border: 3px solid #1A1A1A;
    border-radius: 24px;
    box-shadow: 0 8px 0 #1A1A1A;
    padding: 28px 40px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer-text {
    font-size: 28px;
    font-weight: 700;
    color: #4B5563;
  }
  .footer-url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    font-weight: 900;
    color: #1A1A1A;
    background: #F9DF6D;
    padding: 10px 22px;
    border: 2px solid #1A1A1A;
    border-radius: 12px;
    box-shadow: 0 4px 0 #1A1A1A;
  }
</style>
</head>
<body>

  <div class="header-card">
    <div class="brand-badge">NYT CONNECTIONS FULL SOLUTION &bull; {{DATE_LABEL}}</div>
    <div class="headline">{{HEADLINE}}</div>
  </div>

  <div class="badge-container">
    {{BADGE_HTML}}
  </div>

  <div class="board-stage">
    {{BANNERS_HTML}}
    {{TILES_GRID_HTML}}
  </div>

  <div class="footer-card">
    <div class="footer-text">Test boards without spoilers:</div>
    <div class="footer-url">connectionsassistant.com</div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1920px;
    height: 1080px;
    background-color: #FAF8F5; /* Warm Alabaster */
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #1A1A1A;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 48px 80px;
    overflow: hidden;
  }

  /* Top Navigation Bar */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #FFFFFF;
    border: 3px solid #1A1A1A;
    border-radius: 20px;
    box-shadow: 0 6px 0 #1A1A1A;
    padding: 20px 36px;
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-size: 32px;
    font-weight: 900;
  }
  .guide-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    background: #FEF9C3;
    border: 2px solid #1A1A1A;
    padding: 8px 18px;
    border-radius: 999px;
    box-shadow: 0 3px 0 #1A1A1A;
  }

  /* Main Canvas Area */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 28px 0;
  }

  /* Scene 1: 4x4 Grid */
  .grid-16 {
    display: grid;
    grid-template-columns: repeat(4, 220px);
    grid-gap: 16px;
    background: #FFFFFF;
    padding: 28px;
    border: 4px solid #1A1A1A;
    border-radius: 24px;
    box-shadow: 0 10px 0 #1A1A1A;
  }
  .tile {
    height: 100px;
    background: #EFECE6;
    border: 3px solid #1A1A1A;
    border-radius: 14px;
    box-shadow: 0 5px 0 #1A1A1A;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
    padding: 4px 8px;
  }
  .tile.trap {
    background: #FFD200;
    transform: translateY(2px);
    box-shadow: 0 3px 0 #1A1A1A;
  }

  /* Scene 2: 4-Tier Spectrum */
  .tier-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-gap: 24px;
    width: 100%;
  }
  .tier-card {
    background: #FFFFFF;
    border: 3px solid #1A1A1A;
    border-radius: 20px;
    box-shadow: 0 8px 0 #1A1A1A;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 480px;
  }
  .tier-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 800;
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid #1A1A1A;
    text-align: center;
  }
  .tier-title {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 900;
    margin: 16px 0 8px 0;
  }
  .tier-desc {
    font-size: 17px;
    line-height: 1.5;
    color: #374151;
  }
  .tier-samples {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  .tier-pill {
    font-size: 14px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 8px;
    border: 2px solid #1A1A1A;
    background: #FAF8F5;
  }

  .badge-yellow { background: #F9DF6D; }
  .badge-green  { background: #A0C35A; }
  .badge-blue   { background: #B0C4EF; }
  .badge-purple { 
    background: #BA81C5; 
    color: #FFFFFF; 
    border-color: #6B21A8;
  }
  .tier-card.purple-shimmer {
    border: 4px solid #6B21A8;
    box-shadow: 0 8px 0 #4C1D95, 0 0 24px rgba(186, 129, 197, 0.45);
  }

  /* Scene 3: Red Herring Warning */
  .trap-banner {
    background: #FEF9C3;
    border: 4px solid #1A1A1A;
    border-left: 16px solid #CA8A04;
    border-radius: 20px;
    box-shadow: 0 8px 0 #1A1A1A;
    padding: 36px 48px;
    max-width: 1400px;
  }
  .trap-banner h2 {
    font-family: 'Fraunces', serif;
    font-size: 40px;
    font-weight: 900;
    margin-bottom: 12px;
  }
  .trap-banner p {
    font-size: 22px;
    line-height: 1.5;
    color: #1F2937;
  }

  /* Scene 4: Linguistic Patterns */
  .pattern-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-gap: 24px;
    width: 100%;
  }
  .pattern-card {
    background: #FFFFFF;
    border: 3px solid #1A1A1A;
    border-radius: 20px;
    box-shadow: 0 6px 0 #1A1A1A;
    padding: 24px 32px;
  }
  .pattern-header {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 900;
    margin-bottom: 8px;
  }
  .pattern-body {
    font-size: 18px;
    line-height: 1.5;
    color: #374151;
  }

  /* Scene 5: Semantic Assistant Showcase */
  .assistant-showcase {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    grid-gap: 36px;
    width: 100%;
    align-items: center;
  }
  .showcase-info h2 {
    font-family: 'Fraunces', serif;
    font-size: 42px;
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 16px;
  }
  .showcase-info p {
    font-size: 20px;
    line-height: 1.6;
    color: #374151;
    margin-bottom: 24px;
  }
  .feature-pills {
    display: flex;
    gap: 12px;
  }
  .feature-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    background: #FFFFFF;
    border: 2px solid #1A1A1A;
    border-radius: 12px;
    padding: 10px 18px;
    box-shadow: 0 4px 0 #1A1A1A;
  }
  .preview-box {
    background: #FFFFFF;
    border: 4px solid #1A1A1A;
    border-radius: 24px;
    box-shadow: 0 10px 0 #1A1A1A;
    padding: 32px;
    text-align: center;
  }
  .preview-box .streak {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 16px;
  }
  .preview-box .cta-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 900;
    background: #F9DF6D;
    border: 3px solid #1A1A1A;
    padding: 16px 28px;
    border-radius: 14px;
    display: inline-block;
    box-shadow: 0 6px 0 #1A1A1A;
  }

  /* Footer */
  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
    font-weight: 700;
    color: #6B7280;
  }
  .footer-url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 800;
    color: #1A1A1A;
  }
</style>
</head>
<body>

  <header>
    <div class="brand">Connections Grouping Assistant</div>
    <div class="guide-tag">THE DEFINITIVE STRATEGY GUIDE</div>
  </header>

  <main>
    {{CONTENT}}
  </main>

  <footer>
    <div>Master 16-Word Grouping Grids</div>
    <div class="footer-url">connectionsassistant.com/nyt-connections-guide.html</div>
  </footer>

</body>
</html>
